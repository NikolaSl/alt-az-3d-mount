name: Mechanical motion QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/motion_qa.py"
      - "tools/payload_adjustment_qa.py"
      - "MOTION_QA_PROTOCOL.md"
      - "MECHANICAL_INTEGRITY_PROTOCOL.md"
      - "docs/motion-sweep-plan.md"
      - ".github/workflows/motion-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanical-motion-qa
  cancel-in-progress: true

jobs:
  motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install motion QA runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          python -m pip install --upgrade pip
          python -m pip install numpy trimesh
          python -m pip install --only-binary=:all: python-fcl
          openscad --version
          python --version
          python - <<'PY'
          import numpy
          import trimesh
          import fcl
          from trimesh.collision import CollisionManager
          CollisionManager()
          print("motion QA Python/FCL runtime OK")
          PY

      - name: Run sampled two-axis collision and clearance sweeps
        run: |
          python tools/motion_qa.py --clearance-margin 0.5 --alt-step 1
          cat build/motion-qa/SUMMARY.md

      - name: Run payload adjustment internal solid-pair sweep
        run: |
          python tools/payload_adjustment_qa.py --step 0.5
          cat build/motion-qa/payload-adjustment/SUMMARY.md

      - name: Upload motion QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-qa-${{ github.sha }}
          path: build/motion-qa/
          if-no-files-found: error
          retention-days: 30
