name: Mechanical motion QA

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/motion_qa.py"
      - "MOTION_QA_PROTOCOL.md"
      - "docs/motion-sweep-plan.md"
      - ".github/workflows/motion-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanical-motion-qa
  cancel-in-progress: true

jobs:
  motion-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install OpenSCAD runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          openscad --version
          python3 --version

      - name: Run sampled two-axis collision and clearance sweeps
        run: |
          python3 tools/motion_qa.py --clearance-margin 0.5
          cat build/motion-qa/SUMMARY.md

      - name: Upload motion QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-qa-${{ github.sha }}
          path: build/motion-qa/
          if-no-files-found: error
          retention-days: 30
