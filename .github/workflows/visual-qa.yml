name: Visual geometric QA

on:
  push:
    branches: [main]
    paths:
      - "src/config.scad"
      - "src/parts/payload_clamp_upper.scad"
      - "src/parts/payload_clamp_lower.scad"
      - "src/parts/payload_plate.scad"
      - "src/parts/camera_screw_knob.scad"
      - "src/lib/payload_fastener.scad"
      - "src/assemblies/payload_stage.scad"
      - "src/assemblies/payload_adjustment_section.scad"
      - ".github/workflows/visual-qa.yml"
  workflow_dispatch:
    inputs:
      scad_path:
        description: "OpenSCAD entry point to validate"
        required: true
        default: "src/parts/payload_clamp_upper.scad"
        type: string
      preview_only:
        description: "Skip full STL/mesh/sections (assembly review mode)"
        required: true
        default: false
        type: boolean
      expected_components:
        description: "Expected connected components for full mesh QA"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  custom:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenSCAD and QA runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qa.txt
      - name: Run requested visual/geometric QA
        env:
          SCAD_PATH: ${{ inputs.scad_path }}
          PREVIEW_ONLY: ${{ inputs.preview_only }}
          EXPECTED_COMPONENTS: ${{ inputs.expected_components }}
        run: |
          ARGS=("$SCAD_PATH" --expected-components "$EXPECTED_COMPONENTS")
          if [ "$PREVIEW_ONLY" = "true" ]; then ARGS+=(--preview-only); fi
          python tools/visual_qa.py "${ARGS[@]}"
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: build/qa
          if-no-files-found: warn
          retention-days: 30

  payload-regression:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install OpenSCAD and QA runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          python -m pip install --upgrade pip
          python -m pip install -r requirements-qa.txt
      - name: Full QA for changed payload elementary parts
        run: |
          python tools/visual_qa.py src/parts/payload_clamp_upper.scad
          python tools/visual_qa.py src/parts/payload_clamp_lower.scad
          python tools/visual_qa.py src/parts/payload_plate.scad
          python tools/visual_qa.py src/parts/camera_screw_knob.scad
      - name: Context/section preview QA
        run: |
          python tools/visual_qa.py src/assemblies/payload_stage.scad --preview-only
          python tools/visual_qa.py src/assemblies/payload_adjustment_section.scad --preview-only
      - name: Upload payload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payload-visual-qa-${{ github.sha }}
          path: build/qa
          if-no-files-found: error
          retention-days: 30
