name: Deploy OpenSCAD browser validator

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Vendor OpenSCAD WebAssembly and Three.js
        run: |
          npm install --ignore-scripts --no-save --no-package-lock \
            openscad-wasm@0.0.4 \
            three@0.180.0

          mkdir -p site/vendor/three/addons/controls
          mkdir -p site/vendor/three/addons/loaders

          cp node_modules/openscad-wasm/openscad.js site/vendor/openscad.js
          cp node_modules/three/build/three.module.js site/vendor/three/three.module.js
          cp node_modules/three/examples/jsm/controls/OrbitControls.js \
            site/vendor/three/addons/controls/OrbitControls.js
          cp node_modules/three/examples/jsm/loaders/STLLoader.js \
            site/vendor/three/addons/loaders/STLLoader.js

          # The Three.js add-ons import the bare package name "three". GitHub
          # Pages has no Node-style module resolver and some Android browsers
          # do not support import maps reliably. Rewrite those imports to the
          # vendored ESM module and fail the build if any bare import remains.
          python3 - <<'PY'
          import re
          from pathlib import Path

          for filename in (
              "site/vendor/three/addons/controls/OrbitControls.js",
              "site/vendor/three/addons/loaders/STLLoader.js",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"from\s+(['\"])three\1",
                  "from '../../three.module.js'",
                  text,
              )
              path.write_text(text, encoding="utf-8")
              if re.search(r"from\s+['\"]three['\"]", text):
                  raise SystemExit(f"bare Three.js import remains in {filename}")
          PY

      - name: Snapshot SCAD sources and generate manifest
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          rm -rf site/repo-src
          cp -R src site/repo-src
          touch site/.nojekyll

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("src")
          files = []
          entry_prefixes = ("parts/", "assemblies/", "adapters/")

          for path in sorted(root.rglob("*.scad")):
              rel = path.relative_to(root).as_posix()
              files.append({
                  "path": rel,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          entries = []
          for item in files:
              rel = item["path"]
              if rel.startswith(entry_prefixes):
                  stem = Path(rel).stem.replace("_", " ")
                  entries.append({"path": rel, "label": f"{stem} — {rel}"})

          if not entries:
              entries = [{"path": item["path"], "label": item["path"]} for item in files]

          manifest = {
              "repository": os.environ["REPOSITORY"],
              "commit": os.environ["COMMIT_SHA"],
              "files": files,
              "entries": entries,
          }
          Path("site/scad-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )

          # app.js itself is loaded with a commit query parameter by index.html.
          # Add the same immutable cache key to its dynamically imported ESM
          # dependencies so an Android browser cannot reuse an older add-on
          # that still contained `from 'three'`.
          commit = os.environ["COMMIT_SHA"]
          app_path = Path("site/app.js")
          app = app_path.read_text(encoding="utf-8")
          for asset in (
              "./vendor/three/three.module.js",
              "./vendor/three/addons/controls/OrbitControls.js",
              "./vendor/three/addons/loaders/STLLoader.js",
              "./vendor/openscad.js",
          ):
              app = app.replace(f'"{asset}"', f'"{asset}?v={commit}"')
          app_path.write_text(app, encoding="utf-8")
          PY

          test -s site/vendor/openscad.js
          test -s site/scad-manifest.json
          test -f site/repo-src/parts/az_base.scad

          # Catch the exact failure mode where the page loads but the UI never
          # starts because a top-level module cannot resolve.
          node --check site/app.js
          ! grep -R -n -E "from[[:space:]]+['\"]three['\"]" \
            site/vendor/three/addons

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("site/scad-manifest.json").read_text())
          assert data["files"], "manifest has no SCAD files"
          assert data["entries"], "manifest has no renderable entries"
          assert any(x["path"] == "parts/az_base.scad" for x in data["entries"])

          app = Path("site/app.js").read_text()
          commit = data["commit"]
          assert f"OrbitControls.js?v={commit}" in app
          assert f"STLLoader.js?v={commit}" in app
          assert f"openscad.js?v={commit}" in app
          print(f"manifest OK: {len(data['files'])} files, {len(data['entries'])} entries")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
