name: Deploy OpenSCAD browser validator

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "site/**"
      - "tools/build_browser_manifest.py"
      - "tools/prebuild_browser_previews.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Vendor modern OpenSCAD WebAssembly and Three.js
        run: |
          npm install --ignore-scripts --no-save --no-package-lock three@0.180.0

          mkdir -p site/vendor/openscad
          mkdir -p site/vendor/three/addons/controls
          mkdir -p site/vendor/three/addons/loaders

          # Pin the same modern WebAssembly build used by the official
          # OpenSCAD Playground. The browser worker uses its Manifold backend.
          curl -fL --retry 3 \
            "https://files.openscad.org/playground/OpenSCAD-2025.03.25.wasm24456-WebAssembly-web.zip" \
            -o /tmp/openscad-wasm.zip
          rm -rf /tmp/openscad-wasm
          mkdir -p /tmp/openscad-wasm
          unzip -q /tmp/openscad-wasm.zip -d /tmp/openscad-wasm
          OPENSCAD_JS="$(find /tmp/openscad-wasm -type f -name openscad.js -print -quit)"
          OPENSCAD_WASM="$(find /tmp/openscad-wasm -type f -name openscad.wasm -print -quit)"
          test -n "$OPENSCAD_JS"
          test -n "$OPENSCAD_WASM"
          cp "$OPENSCAD_JS" site/vendor/openscad/openscad.js
          cp "$OPENSCAD_WASM" site/vendor/openscad/openscad.wasm

          cp node_modules/three/build/three.module.js site/vendor/three/three.module.js
          cp node_modules/three/build/three.core.js site/vendor/three/three.core.js
          cp node_modules/three/examples/jsm/controls/OrbitControls.js \
            site/vendor/three/addons/controls/OrbitControls.js
          cp node_modules/three/examples/jsm/loaders/STLLoader.js \
            site/vendor/three/addons/loaders/STLLoader.js

          python3 - <<'PY'
          import re
          from pathlib import Path

          three_module = Path("site/vendor/three/three.module.js").read_text(encoding="utf-8")
          if "from './three.core.js'" not in three_module and 'from "./three.core.js"' not in three_module:
              raise SystemExit("unexpected Three.js build: three.module.js does not import three.core.js")

          for filename in (
              "site/vendor/three/addons/controls/OrbitControls.js",
              "site/vendor/three/addons/loaders/STLLoader.js",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              text = re.sub(r"from\s+(['\"])three\1", "from '../../three.module.js'", text)
              path.write_text(text, encoding="utf-8")
              if re.search(r"from\s+['\"]three['\"]", text):
                  raise SystemExit(f"bare Three.js import remains in {filename}")
          PY

      - name: Install native OpenSCAD for published assembly previews
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb
          openscad --version

      - name: Snapshot source and build dependency-aware manifest
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          rm -rf site/repo-src site/prebuilt
          cp -R src site/repo-src
          mkdir -p site/prebuilt
          touch site/.nojekyll

          python3 tools/build_browser_manifest.py \
            --repository "$REPOSITORY" \
            --commit "$COMMIT_SHA"

      - name: Prebuild expensive assembly previews
        run: |
          python3 tools/prebuild_browser_previews.py \
            --workers 2 \
            --timeout 240

      - name: Version browser assets and validate site
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("site/scad-manifest.json").read_text())
          commit = data["commit"]
          app_path = Path("site/app.js")
          app = app_path.read_text(encoding="utf-8")
          for asset in (
              "./vendor/three/three.module.js",
              "./vendor/three/addons/controls/OrbitControls.js",
              "./vendor/three/addons/loaders/STLLoader.js",
          ):
              app = app.replace(f'\"{asset}\"', f'\"{asset}?v={commit}\"')
              app = app.replace(f"'{asset}'", f"'{asset}?v={commit}'")
          app_path.write_text(app, encoding="utf-8")
          PY

          test -s site/vendor/openscad/openscad.js
          test -s site/vendor/openscad/openscad.wasm
          test -s site/vendor/three/three.module.js
          test -s site/vendor/three/three.core.js
          test -s site/scad-manifest.json
          test -s site/prebuilt/assemblies/full_mount.stl
          test -s site/prebuilt/assemblies/tabletop_full_mount.stl
          test -f site/repo-src/parts/az_base.scad

          node --check site/app.js
          node --check site/openscad-worker.js
          ! grep -R -n -E "from[[:space:]]+['\"]three['\"]" site/vendor/three/addons

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("site/scad-manifest.json").read_text())
          assert data["files"] and data["entries"]
          assert data["renderer"]["worker"] is True
          full = next(x for x in data["entries"] if x["path"] == "assemblies/full_mount.scad")
          tabletop = next(x for x in data["entries"] if x["path"] == "assemblies/tabletop_full_mount.scad")
          assert full.get("prebuilt")
          assert tabletop.get("prebuilt")
          assert len(full["dependencies"]) < len(data["files"]), "dependency closure did not reduce full_mount source set"
          print(f"site manifest OK: {len(data['files'])} files, {len(data['entries'])} entries")
          print(f"full_mount dependency closure: {len(full['dependencies'])}/{len(data['files'])}")
          PY

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
